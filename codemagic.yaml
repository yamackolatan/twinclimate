# Builds the iPhone app in the cloud (Codemagic) and uploads it to Apple.
# Nothing here runs on its own: start a build from codemagic.io
# ("Start new build" → workflow "iOS App Store"). Setup steps for the owner
# are in docs/APP_STORE.md.
workflows:
  ios-app-store:
    name: iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # The App Store Connect API key added in Codemagic (Team settings →
      # Integrations → Developer Portal). Its name must match exactly.
      app_store_connect: TwinClimate App Store key
    environment:
      flutter: 3.44.2
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yamackolatan.twinclimate
      vars:
        # The app's "Apple ID" number from App Store Connect (App
        # Information page). Replace the zeros before the first build.
        APP_STORE_APPLE_ID: 0000000000
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Run the automated checks
        script: flutter test
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build the App Store version
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          flutter build ipa --release \
            --dart-define=STORE_BUILD=true \
            --build-number=$((LATEST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Lands in TestFlight first, so you can try it on an iPhone before
        # sending it to Apple's review from App Store Connect.
        submit_to_testflight: true
        submit_to_app_store: false
